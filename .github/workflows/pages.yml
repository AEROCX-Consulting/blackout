# Publiceert de downloadpagina (map site/) op GitHub Pages:
# https://blackout.aerocx.be/
# Instelling nodig: Settings > Pages > Source = "GitHub Actions".
name: Downloadpagina

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/install*", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Installatiescripts en eigen domein toevoegen
        run: |
          cp scripts/install.sh scripts/install-mac.sh scripts/install.ps1 site/
          echo "blackout.aerocx.be" > site/CNAME
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5